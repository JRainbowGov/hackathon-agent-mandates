# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
# 
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    # uv >= 0.13.4 drops the compromised emSign CAs; pre-commit/action installs via the runner's pip, which may not.
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.5"
        enable-cache: false
    - name: Run pre-commit
      run: uvx --with pre-commit-uv pre-commit run --show-diff-on-failure --color=always --all-files
#
